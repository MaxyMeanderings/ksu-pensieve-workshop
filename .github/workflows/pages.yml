name: Deploy KSU slides
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: slides
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
          cache: npm
          cache-dependency-path: slides/package-lock.json
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build presentation
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base "${SITE_BASE}/"
      - run: npm run export
      - name: Package PDF and route fallback
        run: |
          cp ksu-pensieve.pdf dist/ksu-pensieve.pdf
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: slides/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
